<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المعدل التراكمي الشاملة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-10">

    <div class="max-w-xl mx-auto px-4 pt-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-400 mb-2">حاسبة المعدل التراكمي</h1>
            <p class="text-slate-400 text-sm">احسب معدلك الفصل التراكمي بسهولة وحول نسبة معدلك فوراً</p>
        </div>

        <!-- Main Card -->
        <div class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <!-- System Selector -->
            <div class="mb-6 flex justify-between items-center bg-slate-900 p-2 rounded-xl">
                <span class="text-sm font-medium text-slate-300">نظام المعدل:</span>
                <div class="flex gap-2">
                    <button onclick="setSystem(5)" id="sys5" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white transition">من 5</button>
                    <button onclick="setSystem(4)" id="sys4" class="px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-400 transition">من 4</button>
                </div>
            </div>

            <!-- Courses Container -->
            <div id="courses-list" class="space-y-3 mb-6">
                <!-- Dynamic Rows Go Here -->
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 mb-6">
                <button onclick="addCourse()" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium text-sm transition">
                    + إضافة مادة
                </button>
                <button onclick="calculateGPA()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold text-sm text-white shadow-lg transition">
                    حساب المعدل
                </button>
            </div>

            <!-- Result Box -->
            <div id="result-box" class="hidden bg-slate-900/80 rounded-xl p-5 border border-indigo-500/30 text-center">
                <div class="text-xs text-slate-400 mb-1">المعدل التراكمي المتوقع</div>
                <div id="gpa-val" class="text-4xl font-extrabold text-indigo-400 mb-2">0.00</div>
                <div id="grade-val" class="text-sm font-semibold text-emerald-400">التقدير: -</div>
            </div>
        </div>

        <!-- Quick Conversion -->
        <div class="mt-6 bg-slate-800/60 rounded-2xl p-5 border border-slate-700/50">
            <h3 class="text-sm font-bold text-slate-300 mb-3">تحويل سريع إلى نسبة مئوية</h3>
            <div class="flex gap-3">
                <input type="number" id="convert-input" placeholder="أدخل المعدل" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                <button onclick="quickConvert()" class="bg-indigo-600 hover:bg-indigo-500 px-4 rounded-xl text-xs font-bold whitespace-nowrap">تحويل</button>
            </div>
            <div id="convert-res" class="mt-2 text-xs text-indigo-300 hidden"></div>
        </div>
    </div>

    <script>
        let maxGpa = 5;
        let count = 0;

        function setSystem(val) {
            maxGpa = val;
            document.getElementById('sys5').className = val === 5 ? 'px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white transition' : 'px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-400 transition';
            document.getElementById('sys4').className = val === 4 ? 'px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white transition' : 'px-4 py-1.5 rounded-lg text-sm font-bold bg-slate-800 text-slate-400 transition';
            renderCourses();
        }

        function addCourse() {
            count++;
            const list = document.getElementById('courses-list');
            const row = document.createElement('div');
            row.id = `course-${count}`;
            row.className = "flex gap-2 items-center bg-slate-900/50 p-2.5 rounded-xl border border-slate-800";
            
            const gradeOptions = maxGpa === 5 ? `
                <option value="5.0">A+ (5.0)</option>
                <option value="4.75">A (4.75)</option>
                <option value="4.5">B+ (4.5)</option>
                <option value="4.0">B (4.0)</option>
                <option value="3.5">C+ (3.5)</option>
                <option value="3.0">C (3.0)</option>
                <option value="2.5">D+ (2.5)</option>
                <option value="2.0">D (2.0)</option>
                <option value="1.0">F (1.0)</option>
            ` : `
                <option value="4.0">A (4.0)</option>
                <option value="3.5">B+ (3.5)</option>
                <option value="3.0">B (3.0)</option>
                <option value="2.5">C+ (2.5)</option>
                <option value="2.0">C (2.0)</option>
                <option value="1.5">D+ (1.5)</option>
                <option value="1.0">D (1.0)</option>
                <option value="0.0">F (0.0)</option>
            `;

            row.innerHTML = `
                <input type="text" placeholder="اسم المادة" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white">
                <select class="hours bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    <option value="2">2 ساعات</option>
                    <option value="3" selected>3 ساعات</option>
                    <option value="4">4 ساعات</option>
                    <option value="1">ساعة واحدة</option>
                </select>
                <select class="grade bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    ${gradeOptions}
                </select>
                <button onclick="removeCourse(${count})" class="text-rose-400 hover:text-rose-300 px-2 text-base font-bold">×</button>
            `;
            list.appendChild(row);
        }

        function removeCourse(id) {
            document.getElementById(`course-${id}`).remove();
        }

        function renderCourses() {
            document.getElementById('courses-list').innerHTML = '';
            count = 0;
            addCourse();
            addCourse();
            addCourse();
        }

        function calculateGPA() {
            const hoursElements = document.querySelectorAll('.hours');
            const gradeElements = document.querySelectorAll('.grade');
            
            let totalPoints = 0;
            let totalHours = 0;

            for (let i = 0; i < hoursElements.length; i++) {
                const h = parseFloat(hoursElements[i].value);
                const g = parseFloat(gradeElements[i].value);
                totalPoints += h * g;
                totalHours += h;
            }

            if (totalHours === 0) return;

            const gpa = (totalPoints / totalHours).toFixed(2);
            document.getElementById('gpa-val').innerText = gpa;
            
            let estimate = "";
            const ratio = gpa / maxGpa;
            if (ratio >= 0.9) estimate = "ممتاز مرتفع 🌟";
            else if (ratio >= 0.8) estimate = "ممتاز 👍";
            else if (ratio >= 0.7) estimate = "جيد جداً 🟢";
            else if (ratio >= 0.6) estimate = "جيد 🟡";
            else estimate = "مقبول / يحتاج تحسين 🟠";

            document.getElementById('grade-val').innerText = `التقدير: ${estimate}`;
            document.getElementById('result-box').classList.remove('hidden');
        }

        function quickConvert() {
            const val = parseFloat(document.getElementById('convert-input').value);
            const resBox = document.getElementById('convert-res');
            if (isNaN(val)) return;
            
            let pct = maxGpa === 5 ? (val / 5) * 100 : (val / 4) * 100;
            resBox.innerText = `النسبة المئوية التقريبية: %${pct.toFixed(1)}`;
            resBox.classList.remove('hidden');
        }

        renderCourses();
    </script>
</body>
</html>
